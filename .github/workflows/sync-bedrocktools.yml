name: Sync BedrockTools Android candidates

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import current Android layout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/update-android-mapping.mjs --import-bedrocktools --check
      - name: Publish changed candidate data
        shell: bash
        run: |
          if git diff --quiet -- candidates/android-arm64.json manifest.json; then
            echo "BedrockTools layout is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates/android-arm64.json manifest.json
          git commit -m "Sync Android candidates from BedrockTools"
          git push
